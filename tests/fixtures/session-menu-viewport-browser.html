<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo session menu viewport probe</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>
  body { margin: 0; }
  .sidebar { position: relative; transform: none; width: 280px; height: 230px;
    display: block; overflow: hidden; }
  .session-navigation { height: 160px; overflow: hidden; }
  .session-list { height: 80px; overflow: auto; }
  #header-session-control { position: fixed; top: 8px; right: 8px; }
</style>
<aside class="sidebar">
  <div class="session-navigation">
    <div class="nav-section-heading">会话</div>
    <div id="session-list" class="session-list"></div>
  </div>
</aside>
<span id="session-count"></span>
<select id="session-filter"><option value="active">进行中</option></select>
<div id="header-session-control" class="session-action-control">
  <button id="header-session-button" type="button">会话操作</button>
  <div id="header-session-menu" class="session-menu session-header-menu" hidden role="menu"></div>
</div>
<pre id="result"></pre>
<script type="module">
const { createSessionList } = await import(
  `/app/web/js/features/sessions/session-list.js?fixture=${Date.now()}`);
import { createSessionActionMenu } from
  "/app/web/js/features/sessions/session-action-menu.js";

const session = { id: "test", project_id: "default", agent_id: "mdo.default",
  model_id: "ling-3.0-tiny", title: "Clipped session", status: "active",
  pinned: false, revision: 1, updated_at: Date.now() * 1000 };
const state = { status: "ready", data: { items: [session] } };
let publishSessions;
const store = { get: () => state,
  subscribe(listener) { publishSessions = listener; listener(state); return () => {}; } };
const projectsStore = { get: () => ({ data: { items: [] } }),
  subscribe: () => () => {} };
const navigation = { get: () => ({ projectId: "default", sessionId: "test" }),
  subscribe: () => () => {} };
const output = document.querySelector("#result");
let action = "";
let actionRevision = 0;
try {
  const list = createSessionList({ container: document.querySelector("#session-list"),
    count: document.querySelector("#session-count"),
    filter: document.querySelector("#session-filter"), store, projectsStore,
    navigation, onSelect() {}, onAction(name, selected) {
      action = name;
      actionRevision = selected.revision;
    },
    onNewInProject() {}, onAddProject() {}, onManageProject() {} });
  list.setQuery("");
  const titleNode = document.querySelector(".session-item-title");
  const selection = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(titleNode);
  selection.removeAllRanges();
  selection.addRange(range);
  const newerTime = session.updated_at + 60_000_000;
  state.status = "refreshing";
  publishSessions(state);
  const nodeAfterRefreshing = titleNode === document.querySelector(".session-item-title");
  state.status = "ready";
  state.data = { items: [{ ...session, revision: 2, updated_at: newerTime }] };
  publishSessions(state);
  const nodeAfterReady = titleNode === document.querySelector(".session-item-title");
  await new Promise(requestAnimationFrame);
  const titleSelectionStable = titleNode === document.querySelector(".session-item-title") &&
    selection.toString() === "Clipped session";
  const titleNodeStable = titleNode === document.querySelector(".session-item-title");
  const selectedTitleText = selection.toString();
  const timestampUpdated = document.querySelector(".session-item-time")
    ?.dataset.relativeTime === String(newerTime);
  selection.removeAllRanges();
  let more = document.querySelector(".session-more");
  more.scrollIntoView({ block: "nearest" });
  await new Promise(requestAnimationFrame);
  more.click();
  await new Promise(requestAnimationFrame);
  more = document.querySelector(".session-more");
  let menu = document.querySelector("#sidebar-session-menu");
  const rect = menu.getBoundingClientRect();
  const withinViewport = rect.top >= 0 && rect.left >= 0 &&
    rect.bottom <= innerHeight && rect.right <= innerWidth;
  const outsideClippingParent = !document.querySelector(".sidebar").contains(menu);
  const firstFocused = document.activeElement === menu.firstElementChild;
  menu.scrollTop = menu.scrollHeight;
  menu.lastElementChild.focus();
  const menuScroll = menu.scrollTop;
  state.status = "refreshing";
  publishSessions(state);
  state.status = "ready";
  publishSessions(state);
  const menuReadingStable = menu === document.querySelector("#sidebar-session-menu") &&
    menu.scrollTop === menuScroll && document.activeElement === menu.lastElementChild;
  function escape(options = {}) {
    const event = new KeyboardEvent("keydown", { key: "Escape", bubbles: true,
      cancelable: true, ...options });
    if (options.keyCode === 229) Object.defineProperty(event, "keyCode", { value: 229 });
    document.activeElement.dispatchEvent(event);
  }
  escape({ isComposing: true });
  const sidebarComposingKept = Boolean(document.querySelector("#sidebar-session-menu"));
  escape({ keyCode: 229 });
  const sidebarCandidateKept = Boolean(document.querySelector("#sidebar-session-menu"));
  escape();
  const escapeRestored = !document.querySelector("#sidebar-session-menu") &&
    document.activeElement === more;
  more.click();
  await new Promise(requestAnimationFrame);
  more = document.querySelector(".session-more");
  menu = document.querySelector("#sidebar-session-menu");
  menu.scrollTop = menu.scrollHeight;
  await new Promise(requestAnimationFrame);
  const last = menu.lastElementChild;
  const lastRect = last.getBoundingClientRect();
  const hit = document.elementFromPoint(lastRect.left + lastRect.width / 2,
    lastRect.top + lastRect.height / 2);
  const lastReachable = lastRect.top >= menu.getBoundingClientRect().top &&
    lastRect.bottom <= menu.getBoundingClientRect().bottom &&
    (hit === last || last.contains(hit));
  last.click();
  const actionWorked = action === "trash" && actionRevision === 2 &&
    !document.querySelector("#sidebar-session-menu") &&
    document.activeElement === document.querySelector(".session-more");
  const headerButton = document.querySelector("#header-session-button");
  const headerMenu = document.querySelector("#header-session-menu");
  const topMenu = createSessionActionMenu({
    control: document.querySelector("#header-session-control"), button: headerButton,
    menu: headerMenu,
    navigation: { get: () => ({ view: "workspace", projectId: "default",
      sessionId: "test" }), subscribe: () => () => {} },
    store: { get: () => ({ data: session }), subscribe: () => () => {} },
    onAction() {},
  });
  headerButton.click();
  function menuKey(target, key) {
    target.dispatchEvent(new KeyboardEvent("keydown", { key,
      bubbles: true, cancelable: true }));
  }
  function inHeaderViewport(item) {
    const itemRect = item.getBoundingClientRect();
    const menuRect = headerMenu.getBoundingClientRect();
    return itemRect.top >= menuRect.top && itemRect.bottom <= menuRect.bottom;
  }
  menuKey(headerButton, "End");
  const headerEndFocused = document.activeElement === headerMenu.lastElementChild;
  const headerEndVisible = inHeaderViewport(headerMenu.lastElementChild);
  const headerEndScrolled = innerHeight > 350 ||
    (headerMenu.scrollHeight > headerMenu.clientHeight && headerMenu.scrollTop > 0);
  menuKey(headerMenu.lastElementChild, "ArrowDown");
  const headerWrapFocused = document.activeElement === headerMenu.firstElementChild;
  const headerWrapVisible = inHeaderViewport(headerMenu.firstElementChild);
  menuKey(headerMenu.firstElementChild, "End");
  menuKey(headerMenu.lastElementChild, "Home");
  const headerHomeFocused = document.activeElement === headerMenu.firstElementChild;
  const headerHomeVisible = inHeaderViewport(headerMenu.firstElementChild);
  escape({ isComposing: true });
  const headerComposingKept = !headerMenu.hidden;
  escape({ keyCode: 229 });
  const headerCandidateKept = !headerMenu.hidden;
  escape();
  const headerEscapeRestored = headerMenu.hidden && document.activeElement === headerButton;
  topMenu.destroy();
  const passed = withinViewport && outsideClippingParent && firstFocused &&
    menuReadingStable &&
    sidebarComposingKept && sidebarCandidateKept && escapeRestored &&
    lastReachable && actionWorked && headerComposingKept &&
    headerCandidateKept && headerEscapeRestored && headerEndFocused &&
    headerEndVisible && headerEndScrolled && headerWrapFocused && headerWrapVisible &&
    headerHomeFocused && headerHomeVisible && titleSelectionStable && timestampUpdated;
  output.dataset.passed = String(passed);
  output.textContent = JSON.stringify({ passed, withinViewport, outsideClippingParent,
    titleSelectionStable, titleNodeStable, nodeAfterRefreshing, nodeAfterReady,
    selectedTitleText, timestampUpdated,
    firstFocused, menuReadingStable, sidebarComposingKept, sidebarCandidateKept, escapeRestored,
    lastReachable, actionWorked, actionRevision, headerComposingKept, headerCandidateKept,
    headerEscapeRestored, headerEndFocused, headerEndVisible, headerEndScrolled,
    headerWrapFocused, headerWrapVisible, headerHomeFocused, headerHomeVisible,
    initialRect: { top: rect.top, bottom: rect.bottom, left: rect.left, right: rect.right },
    viewport: { width: innerWidth, height: innerHeight } }, null, 2);
} catch (error) {
  output.dataset.passed = "false";
  output.textContent = error.stack ?? String(error);
}
</script>
</html>
