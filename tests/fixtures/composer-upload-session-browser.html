<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo composer upload session probe</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>body{padding:20px;background:var(--bg);color:var(--ink)}</style>
<div id="cases"></div>
<script type="module">
const { createComposerImages } = await import(
  `/app/web/js/features/chat/composer-images.js?fixture=${Date.now()}`);

const root = document.querySelector("#cases");
const a = "a".repeat(32);
const b = "b".repeat(32);
const c = "c".repeat(32);
const originalFetch = window.fetch;
const deleted = [];
const uploadTypes = [];
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));
async function until(predicate) {
  for (let attempt = 0; attempt < 30; attempt++) {
    if (predicate()) return true;
    await nextFrame();
  }
  return predicate();
}
let finishA;
let finishC;
window.fetch = async (url, options = {}) => {
  if (options.method === "DELETE") {
    deleted.push(String(url));
    return new Response(JSON.stringify({ ok: true, data: {} }), { status: 200 });
  }
  if (options.method === "POST") {
    const session = /\/sessions\/([^/]+)\/attachments$/.exec(String(url))?.[1];
    uploadTypes.push({ session, mime: options.headers?.["Content-Type"],
      fileType: options.body?.type });
    if (session === "first" || session === "created") {
      return new Promise((resolve) => {
        if (session === "first") finishA = () => resolve(new Response(
          JSON.stringify({ ok: true, data: { id: a } }), { status: 200 }));
        else finishC = () => resolve(new Response(
          JSON.stringify({ ok: true, data: { id: c } }), { status: 200 }));
      });
    }
    return new Response(JSON.stringify({ ok: true, data: { id: b } }),
      { status: 200 });
  }
  return originalFetch(url, options);
};

function createCase(label, initialRoute, ensureSession) {
  const section = document.createElement("section");
  section.innerHTML = `<h2></h2><form class="composer"><textarea></textarea>` +
    `<button type="button">添加图片</button><input type="file" hidden>` +
    `<div class="composer-images"></div></form><pre></pre>`;
  section.querySelector("h2").textContent = label;
  root.append(section);
  const [composer, prompt, button, input, strip, output] = [
    section.querySelector("form"), section.querySelector("textarea"),
    section.querySelector("button"), section.querySelector("input"),
    section.querySelector(".composer-images"), section.querySelector("pre"),
  ];
  let route = initialRoute;
  const changes = [];
  const errors = [];
  const images = createComposerImages({ composer, prompt, button, input, strip,
    navigation: { get: () => route },
    modelsStore: { get: () => ({ data: { models: [
      { id: "image", attachments: 1 }] } }) },
    sessionStore: { get: () => ({ data: { model_id: "image" } }) },
    ensureSession: async () => {
      route = await ensureSession();
      return route;
    },
    onChange: (value) => changes.push({ session: route.sessionId, value }),
    onUploading() {}, onError: (error) => errors.push(error.message),
  });
  function add(name = "probe.png", type = "image/png") {
    const transfer = new DataTransfer();
    transfer.items.add(new File([new Uint8Array([1])], name, { type }));
    input.files = transfer.files;
    input.dispatchEvent(new Event("change"));
  }
  function pasteClipboard(files, items) {
    const event = new Event("paste", { bubbles: true, cancelable: true });
    Object.defineProperty(event, "clipboardData", { value: { files, items } });
    prompt.dispatchEvent(event);
    return event.defaultPrevented;
  }
  function pasteItemOnly(name = "clipboard.png", fileType = "image/png") {
    const image = new File([new Uint8Array([1])], name, { type: fileType });
    return pasteClipboard([], [{ type: "image/png", getAsFile: () => image }]);
  }
  function pasteFilesOnly() {
    const image = new File([new Uint8Array([1])], "clipboard.png",
      { type: "image/png" });
    return pasteClipboard([image], []);
  }
  function pasteBoth() {
    const image = new File([new Uint8Array([1])], "clipboard.png",
      { type: "image/png" });
    return pasteClipboard([image],
      [{ type: "image/png", getAsFile: () => image }]);
  }
  return { images, button, strip, output, changes, errors, add,
    pasteItemOnly, pasteFilesOnly, pasteBoth,
    setRoute(value) { route = value; images.set([]); } };
}

try {
  const first = createCase("切换会话时的并行上传",
    { projectId: "qa", sessionId: "first" });
  first.add();
  const firstBusy = first.images.isUploading();
  first.setRoute({ projectId: "qa", sessionId: "second" });
  const secondUsable = !first.images.isUploading() && !first.button.disabled;
  first.add();
  const secondSaved = await until(() => first.images.get().join() === b);
  finishA();
  await until(() => deleted.some((url) =>
    url.includes(`/sessions/first/attachments/${a}`)));
  const firstPassed = firstBusy && secondUsable && secondSaved &&
    first.images.get().join() === b && first.errors.length === 0 &&
    deleted.some((url) => url.includes(`/sessions/first/attachments/${a}`));
  first.output.dataset.passed = String(firstPassed);
  first.output.textContent = JSON.stringify({ firstPassed, firstBusy, secondUsable,
    secondSaved, changes: first.changes, errors: first.errors, deleted }, null, 2);

  const created = createCase("新任务创建会话时保持上传锁",
    { projectId: "qa", sessionId: "" },
    async () => ({ projectId: "qa", sessionId: "created" }));
  created.add();
  await nextFrame();
  const newBusy = created.images.isUploading() && created.button.disabled;
  finishC();
  await until(() => !created.images.isUploading());
  const createdPassed = newBusy && !created.images.isUploading() &&
    created.images.get().join() === c && created.errors.length === 0;
  created.output.dataset.passed = String(createdPassed);
  created.output.textContent = JSON.stringify({ createdPassed, newBusy,
    attachments: created.images.get(), errors: created.errors }, null, 2);

  const unknownMime = createCase("系统未提供图片 MIME",
    { projectId: "qa", sessionId: "unknown-mime" });
  unknownMime.add("capture.PNG", "");
  await until(() => unknownMime.images.get().join() === b);
  const unknownPassed = unknownMime.images.get().join() === b &&
    unknownMime.errors.length === 0 && uploadTypes.some((item) =>
      item.session === "unknown-mime" && item.mime === "image/png" &&
      item.fileType === "");
  unknownMime.output.dataset.passed = String(unknownPassed);
  unknownMime.output.textContent = JSON.stringify({ unknownPassed,
    uploads: uploadTypes.filter((item) => item.session === "unknown-mime"),
    errors: unknownMime.errors }, null, 2);

  const clipboardItem = createCase("仅提供 item 的剪贴板图片",
    { projectId: "qa", sessionId: "clipboard-item" });
  const pasteHandled = clipboardItem.pasteItemOnly();
  await until(() => clipboardItem.images.get().join() === b);
  const clipboardPassed = pasteHandled && clipboardItem.images.get().join() === b &&
    clipboardItem.errors.length === 0 && uploadTypes.some((item) =>
      item.session === "clipboard-item" && item.mime === "image/png");
  clipboardItem.output.dataset.passed = String(clipboardPassed);
  clipboardItem.output.textContent = JSON.stringify({ clipboardPassed,
    pasteHandled, attachments: clipboardItem.images.get(),
    errors: clipboardItem.errors }, null, 2);

  const clipboardMime = createCase("由 item 提供图片 MIME",
    { projectId: "qa", sessionId: "clipboard-mime" });
  const mimeHandled = clipboardMime.pasteItemOnly("clipboard", "");
  await until(() => clipboardMime.images.get().join() === b);
  const mimePassed = mimeHandled && clipboardMime.images.get().join() === b &&
    clipboardMime.errors.length === 0 && uploadTypes.some((item) =>
      item.session === "clipboard-mime" && item.mime === "image/png" &&
      item.fileType === "");
  clipboardMime.output.dataset.passed = String(mimePassed);
  clipboardMime.output.textContent = JSON.stringify({ mimePassed,
    mimeHandled, uploads: uploadTypes.filter((item) =>
      item.session === "clipboard-mime"), errors: clipboardMime.errors }, null, 2);

  const clipboardFiles = createCase("仅提供 files 的剪贴板图片",
    { projectId: "qa", sessionId: "clipboard-files" });
  const filesHandled = clipboardFiles.pasteFilesOnly();
  await until(() => clipboardFiles.images.get().join() === b);
  const filesPassed = filesHandled && clipboardFiles.images.get().join() === b &&
    clipboardFiles.errors.length === 0 && uploadTypes.some((item) =>
      item.session === "clipboard-files" && item.mime === "image/png");
  clipboardFiles.output.dataset.passed = String(filesPassed);
  clipboardFiles.output.textContent = JSON.stringify({ filesPassed,
    filesHandled, errors: clipboardFiles.errors }, null, 2);

  const clipboardBoth = createCase("同时提供 item 与 file 的剪贴板图片",
    { projectId: "qa", sessionId: "clipboard-both" });
  const bothHandled = clipboardBoth.pasteBoth();
  await until(() => clipboardBoth.images.get().join() === b);
  const bothUploads = uploadTypes.filter((item) =>
    item.session === "clipboard-both");
  const bothPassed = bothHandled && clipboardBoth.images.get().join() === b &&
    bothUploads.length === 1 && clipboardBoth.errors.length === 0;
  clipboardBoth.output.dataset.passed = String(bothPassed);
  clipboardBoth.output.textContent = JSON.stringify({ bothPassed,
    bothHandled, uploads: bothUploads, errors: clipboardBoth.errors }, null, 2);
} catch (error) {
  const output = document.createElement("pre");
  output.dataset.passed = "false";
  output.textContent = error.stack ?? String(error);
  root.append(output);
} finally { window.fetch = originalFetch; }
</script>
</html>
