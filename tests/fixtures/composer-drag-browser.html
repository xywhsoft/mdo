<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo composer drag probe</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>
  body { margin: 24px; background: var(--surface); color: var(--ink); }
  .probe-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  #composer { width: min(600px, 100%); min-height: 140px; }
</style>
<div class="probe-controls">
  <button id="enter-file" type="button">模拟文件进入卡片</button>
  <button id="leave-child" type="button">模拟离开内部元素</button>
  <button id="drop-file" type="button">模拟放下文件</button>
  <button id="drop-outside" type="button">模拟放到输入框外</button>
  <button id="handled-drop" type="button">模拟其他组件接收文件</button>
  <button id="sparse-transfer" type="button">模拟 WebView 缺少 Files 标记</button>
</div>
<p id="qa-status" role="status">等待拖放</p>
<form class="composer" id="composer">
  <textarea id="prompt" aria-label="任务输入" placeholder="把文件拖到这里"></textarea>
  <div id="composer-images" class="composer-images" hidden></div>
  <button id="composer-attach" type="button">添加图片</button>
  <input id="composer-file" type="file" hidden>
</form>
<div id="toast-region"></div>
<script type="module">
import { createComposerImages } from "/app/web/js/features/chat/composer-images.js";
import { createResourceStore } from "/app/web/js/state/store.js";

const composer = document.querySelector("#composer");
const status = document.querySelector("#qa-status");
const model = createResourceStore({ models: [{ id: "image-qa", attachments: 1 }] });
const session = createResourceStore({ id: "qa-session", project_id: "default",
  model_id: "image-qa" });
const navigation = { get: () => ({ projectId: "default", sessionId: "qa-session" }) };
const transfer = new DataTransfer();
transfer.items.add(new File(["qa"], "notes.txt", { type: "text/plain" }));
function drag(node, type) {
  const event = new DragEvent(type, {
    bubbles: true, cancelable: true, dataTransfer: transfer,
  });
  node.dispatchEvent(event);
  return event;
}
createComposerImages({ composer, prompt: document.querySelector("#prompt"),
  button: document.querySelector("#composer-attach"),
  input: document.querySelector("#composer-file"),
  strip: document.querySelector("#composer-images"), navigation,
  modelsStore: model, sessionStore: session,
  ensureSession: async () => navigation.get(), onChange: () => {},
  onUploading: () => {}, onError: (error) => { status.dataset.error = error.message; } });
let over = 0;
let highlighted = 0;
composer.addEventListener("dragover", () => {
  over += 1;
  if (composer.hasAttribute("data-drag-over") &&
      getComputedStyle(composer).borderStyle === "dashed") highlighted += 1;
});
composer.addEventListener("drop", (event) => {
  status.textContent = `拖动经过 ${over} 次，其中 ${highlighted} 次显示落点；放下后提示${composer.hasAttribute("data-drag-over") ? "未清除" : "已清除"}`;
  status.dataset.over = String(over);
  status.dataset.highlighted = String(highlighted);
  status.dataset.cleared = String(!composer.hasAttribute("data-drag-over"));
  status.dataset.types = [...(event.dataTransfer?.types ?? [])].join(",");
  status.dataset.files = String(event.dataTransfer?.files?.length ?? 0);
});
document.querySelector("#enter-file").addEventListener("click", () => {
  drag(composer, "dragenter");
  drag(document.querySelector("#prompt"), "dragenter");
  drag(document.querySelector("#prompt"), "dragover");
  status.dataset.entered = String(composer.hasAttribute("data-drag-over"));
});
document.querySelector("#leave-child").addEventListener("click", () => {
  drag(document.querySelector("#prompt"), "dragleave");
  status.dataset.nested = String(composer.hasAttribute("data-drag-over"));
});
document.querySelector("#drop-file").addEventListener("click", () =>
  drag(composer, "drop"));
document.querySelector("#drop-outside").addEventListener("click", () => {
  drag(composer, "dragenter");
  const over = drag(document.querySelector("#qa-status"), "dragover");
  const drop = drag(document.querySelector("#qa-status"), "drop");
  status.dataset.outsideOverPrevented = String(over.defaultPrevented);
  status.dataset.outsideDropPrevented = String(drop.defaultPrevented);
  status.dataset.outsideDropEffect = transfer.dropEffect;
  status.dataset.outsideCleared = String(!composer.hasAttribute("data-drag-over"));
  status.textContent = "文件在输入框外释放时不会离开当前页面";
});
const otherTarget = document.createElement("div");
document.body.append(otherTarget);
otherTarget.addEventListener("dragover", (event) => {
  event.preventDefault();
});
otherTarget.addEventListener("drop", (event) => event.preventDefault());
document.querySelector("#handled-drop").addEventListener("click", () => {
  drag(composer, "dragenter");
  const over = drag(otherTarget, "dragover");
  const drop = drag(otherTarget, "drop");
  status.dataset.handledOver = String(over.defaultPrevented);
  status.dataset.handledDrop = String(drop.defaultPrevented);
  status.dataset.handledCleared = String(!composer.hasAttribute("data-drag-over"));
  status.textContent = "其他组件处理文件后输入区提示已清除";
});
document.querySelector("#sparse-transfer").addEventListener("click", () => {
  // Some native WebViews reveal file items during drag but omit the Files type;
  // the actual File object then appears only in the drop event.
  function sparseDrag(node, type, dataTransfer) {
    const event = new Event(type, { bubbles: true, cancelable: true });
    Object.defineProperty(event, "dataTransfer", { value: dataTransfer });
    node.dispatchEvent(event);
    return event;
  }
  const file = new File(["qa"], "notes.txt", { type: "text/plain" });
  const dragging = { types: [], items: [{ kind: "file" }], files: [],
    dropEffect: "none" };
  const dropped = { types: [], items: [], files: [file],
    dropEffect: "none" };
  sparseDrag(composer, "dragenter", dragging);
  const over = sparseDrag(document.querySelector("#prompt"),
    "dragover", dragging);
  const drop = sparseDrag(composer, "drop", dropped);
  status.dataset.sparseOver = String(over.defaultPrevented);
  status.dataset.sparseDrop = String(drop.defaultPrevented);
  status.dataset.sparseCleared = String(!composer.hasAttribute("data-drag-over"));
  sparseDrag(composer, "dragenter", dragging);
  const outsideOver = sparseDrag(status, "dragover", dragging);
  const outsideDrop = sparseDrag(status, "drop", dropped);
  status.dataset.sparseOutsideOver = String(outsideOver.defaultPrevented);
  status.dataset.sparseOutsideDrop = String(outsideDrop.defaultPrevented);
  status.dataset.sparseOutsideCleared =
    String(!composer.hasAttribute("data-drag-over"));
  const textTransfer = { types: ["text/plain"], items: [], files: [],
    dropEffect: "none" };
  const textOver = sparseDrag(composer, "dragover", textTransfer);
  const textDrop = sparseDrag(composer, "drop", textTransfer);
  status.dataset.textOverPrevented = String(textOver.defaultPrevented);
  status.dataset.textDropPrevented = String(textDrop.defaultPrevented);
  status.textContent = "无 Files 标记的文件仍被接收，普通文本拖放保持原样";
});
</script>
