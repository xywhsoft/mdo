<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo recovery context probe</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>body{margin:16px}.probe-controls{display:flex;flex-wrap:wrap;gap:8px}#recovery-list{max-width:640px}#qa-status{white-space:pre-wrap;overflow-wrap:anywhere}</style>
<div class="probe-controls">
  <button id="select-a">切到会话 A</button><button id="select-b">切到会话 B</button>
  <button id="new-token">替换当前恢复令牌</button><button id="refresh">刷新同一令牌</button>
  <button id="finish-a">完成 A 响应</button><button id="finish-b">完成 B 响应</button>
</div>
<p id="qa-owner" role="status"></p>
<pre id="qa-status">[]</pre>
<button id="decisions-tab">决策</button>
<p id="recovery-summary"></p><div id="recovery-list"></div><div id="toast-region"></div>
<script type="module">
const { createRecoveryPanel } = await import('/app/web/js/features/approvals/recovery-panel.js?fixture='+Date.now());
import { recoveryStore, selectRecovery } from '/app/web/js/state/recovery.js';
const contexts = Object.fromEntries(['a','b'].map(id=>[id,{
  project_id:'default',session_id:id,resume_required:true,recovery_token:id.repeat(64),
  revision:1,last_sequence:1,total:1,items:[{tool_call_id:'shared-id',tool:'edit',turn:1,
    effects:['workspace_write'],tool_available:true,automatic_retry_safe:false,
    arguments_json:JSON.stringify({path:`${id}.txt`})}],
}]));
let selected='a'; const requests=[], completions=new Map();
function report(){document.querySelector('#qa-status').textContent=JSON.stringify(requests,null,2)}
function publish(){document.querySelector('#qa-owner').textContent=`会话 ${selected.toUpperCase()}`;
  selectRecovery('default',selected);recoveryStore.setData(structuredClone(contexts[selected]))}
window.fetch=async (url,options={})=>{
  const id=/\/sessions\/([ab])\//.exec(url)?.[1];
  if(!id)throw new Error('Unexpected fixture scope');
  if(options.method==='GET'&&url.endsWith('/recovery'))return Response.json({ok:true,data:structuredClone(contexts[id])});
  if(options.method!=='POST'||!url.endsWith('/resume'))throw new Error('Unexpected fixture mutation');
  requests.push({session:id,body:JSON.parse(options.body)});report();
  return new Promise(resolve=>completions.set(id,()=>resolve(Response.json({ok:true,data:{
    id:id.repeat(32),project_id:'default',session_id:id,terminal:false,
  }}))));
};
createRecoveryPanel({container:document.querySelector('#recovery-list'),summary:document.querySelector('#recovery-summary'),
  store:recoveryStore,onResume:(run,owner)=>{requests.push({completed:run.session_id,owner:owner?.session_id??null});report();}});
for(const id of ['a','b']){
  document.querySelector(`#select-${id}`).onclick=()=>{selected=id;publish()};
  document.querySelector(`#finish-${id}`).onclick=()=>completions.get(id)?.();
}
document.querySelector('#new-token').onclick=()=>{contexts[selected].recovery_token='c'.repeat(64);contexts[selected].revision++;publish()};
document.querySelector('#refresh').onclick=publish;
publish();
</script>
</html>
