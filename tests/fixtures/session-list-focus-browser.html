<!doctype html>
<html lang="en">
<meta charset="utf-8">
<title>Session sidebar focus regression</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<pre id="result">Running</pre>
<script type="module">
import { createSessionList } from "/app/web/js/features/sessions/session-list.js";
import { createRunNotifications } from "/app/web/js/features/shell/run-notifications.js";

const checks = {};
const assert = (condition, message) => { if (!condition) throw new Error(message); };
async function painted(predicate, message) {
  for (let i = 0; i < 60; ++i) {
    await new Promise(resolve => requestAnimationFrame(resolve));
    if (predicate()) return;
  }
  throw new Error(message);
}
const session = (id, project_id = "default", extra = {}) => ({ id, project_id,
  title: id, status: "active", pinned: false, updated_at: 100, ...extra });

function fixture(items, notify = false) {
  const root = document.createElement("aside"); root.className = "sidebar";
  root.innerHTML = '<select><option value="active">Active</option><option value="trash">Trash</option></select><span></span><div class="session-list"></div>';
  document.body.append(root);
  const container = root.querySelector("div"), filter = root.querySelector("select");
  let state = { status: "ready", updatedAt: 1, data: { items } }, publish;
  let runs = { status: "ready", data: { items: [] } };
  const runListeners = new Set();
  const store = { get: () => state,
    subscribe(listener) { publish = listener; listener(state); return () => {}; } };
  const runsStore = { get: () => runs, subscribe(listener) {
    runListeners.add(listener); listener(runs); return () => runListeners.delete(listener);
  } };
  const projectActions = [];
  let selected = { view: "workspace", projectId: items[0]?.project_id, sessionId: items[0]?.id };
  const navigationListeners = new Set();
  const navigation = { get: () => selected, subscribe(listener) {
    navigationListeners.add(listener); listener(selected); return () => navigationListeners.delete(listener);
  } };
  const view = createSessionList({ container, count: root.querySelector("span"), filter, store, runsStore,
    projectsStore: { get: () => ({ data: { items: [] } }), subscribe: () => () => {} },
    navigation, onSelect(session) { select(session.id, session.project_id); }, onAction() {}, onNewInProject() {},
    onProjectAction(action, id) { projectActions.push({ action, id }); } });
  function select(id, projectId = "default", page = "workspace") {
    selected = { view: page, projectId, sessionId: id };
    for (const listener of navigationListeners) listener(selected);
  }
  const baseTitle = document.title;
  if (notify) createRunNotifications({ runsStore, navigation,
    settingsStore: { get: () => ({ data: { notifications: { sound: false } } }) },
    onUnreadChange(keys) { view.setUnread(keys); } });
  return { container, filter, view, projectActions,
    select,
    item(id) { return [...container.querySelectorAll(".session-item")]
      .find(node => node.dataset.sessionKey.endsWith("/" + id)); },
    update(next) { state = { ...state, data: { items: next } }; publish(state); },
    runs(items, status = "ready") { runs = { status, data: { items } }; for (const listener of runListeners) listener(runs); },
    focusValid() { return container.contains(document.activeElement) && document.activeElement.isConnected; },
    close() { view.destroy(); root.remove(); document.title = baseTitle; } };
}

async function check(name, items, run, notify = false) {
  const f = fixture(items, notify);
  try { await new Promise(resolve => setTimeout(resolve, 100)); await run(f); checks[name] = true; }
  finally { f.close(); }
}

try {
  await check("project_directory_menu", [session("entry", "workspace")], async f => {
    const trigger = f.container.querySelector('[data-sidebar-focus="menu:project:workspace"]');
    trigger.click();
    await painted(() => document.querySelector('[role="menuitem"]'), "project menu must open");
    const open = [...document.querySelectorAll('[role="menuitem"]')]
      .find(item => item.textContent.includes("在资源管理器中打开"));
    assert(open, "project menu must offer opening its workspace directory");
    open.click();
    assert(JSON.stringify(f.projectActions) === JSON.stringify([{ action: "open_directory", id: "workspace" }]),
      "the menu must pass the owning project identity, not the selected session or a browser path");
    assert(!document.querySelector('[role="menuitem"]') && f.focusValid(), "opening a directory must close the menu and retain sidebar focus");
  });
  const one = session("one"), two = session("two");
  await check("unread_completion_indicators_without_remount", [one, two], async f => {
    f.select("two"); f.view.setUnread(["default/one"]);
    const original = f.item("one"); original.focus();
    const state = () => original.closest(".session-item-row").dataset.runState;
    f.update([{ ...one, last_run_outcome: "succeeded", last_run_at: 30 }, two]);
    assert(f.item("one") === original && document.activeElement === original && state() === "succeeded", "completion must preserve row and focus");
    assert(getComputedStyle(original.querySelector(".session-run-indicator")).visibility === "visible",
      "keyboard focus alone must not acknowledge a result");
    f.filter.focus();
    const dot = original.querySelector(".session-run-indicator");
    const green = getComputedStyle(dot).backgroundColor;
    assert(getComputedStyle(dot).width === "7px" && dot.title, "completed result must have a small accessible dot");
    f.update([{ ...one, last_run_outcome: "failed", last_run_at: 40 }, two]);
    await painted(() => state() === "failed" && getComputedStyle(dot).backgroundColor !== green,
      "failure must display a different color");
    f.runs([{ project_id: "default", session_id: "one", state: "running", terminal: false }]);
    await painted(() => state() === "running" && getComputedStyle(dot).width === "12px",
      "new work must replace the old result with its spinner");
    f.runs([], "error"); assert(state() === "running", "a failed poll must not invent completion");
    f.runs([], "idle"); assert(state() === "failed", "an explicit device reset must clear stale running state");
    f.runs([]); assert(state() === "failed", "persisted result must survive run history eviction");
    f.update([{ ...one, last_run_outcome: "cancelled", last_run_at: 50 }, two]);
    await painted(() => state() === "cancelled" && getComputedStyle(dot).display === "none",
      "manual stop must not show success or failure");
    f.update([{ ...one, last_run_outcome: "", last_run_at: 60 }, two]);
    assert(!state(), "new submission must clear old completion");
  });
  await check("completion_colors_follow_light_and_dark_theme", [
    { ...one, last_run_outcome: "succeeded" }, { ...two, last_run_outcome: "failed" }], async f => {
    f.select(""); f.view.setUnread(["default/one", "default/two"]);
    try {
      for (const theme of ["light", "dark"]) {
        document.documentElement.dataset.theme = theme;
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const success = f.item("one").querySelector(".session-run-indicator");
        const failed = f.item("two").querySelector(".session-run-indicator");
        assert(getComputedStyle(success).backgroundColor !== getComputedStyle(failed).backgroundColor,
          `${theme} theme must distinguish success and failure`);
      }
    } finally { delete document.documentElement.dataset.theme; }
  });
  await check("completion_is_unread_until_session_opened", [one, two, session("one", "other")], async f => {
    const run = { id: "background", project_id: "default", session_id: "two",
      terminal: false, state: "running", ended_at: 0 };
    const state = (id = "two") => f.item(id).closest(".session-item-row").dataset.runState;
    const finish = (id, result, at) => ({ ...run, id, state: result, terminal: true, ended_at: at });
    f.runs([run]); assert(state() === "running", "background progress must remain visible");
    f.runs([finish("background", "succeeded", 30)]);
    f.update([one, { ...two, last_run_outcome: "succeeded", last_run_at: 30 }, session("one", "other")]);
    assert(state() === "succeeded" && document.title.startsWith("(1)"), "new background result must be unread");
    const dot = f.item("two").querySelector(".session-run-indicator");
    const time = f.item("two").querySelector(".session-item-time");
    const center = node => { const rect = node.getBoundingClientRect(); return rect.top + rect.height / 2; };
    assert(Math.abs(center(dot) - center(time)) < .5 && getComputedStyle(time).lineHeight === "18px",
      "dot and time must share the same vertical center and an explicit text line height");
    f.item("two").click();
    assert(!state() && !f.item("two").closest(".session-item-row").hasAttribute("data-unread") &&
      !document.title.startsWith("(1)"), "opening the session must clear its dot and unread count");
    f.select("one");
    f.runs([finish("background", "succeeded", 30)]);
    f.update([one, { ...two, last_run_outcome: "succeeded", last_run_at: 30 }, session("one", "other")]);
    assert(!state(), "switching away and polling persisted results must not restore the read dot");
    f.runs([{ ...run, id: "retry" }]);
    f.runs([finish("retry", "failed", 40)]);
    assert(state() === "failed", "a later background failure must become a new unread red dot");
    f.item("two").click(); assert(!state(), "opening a failed session must also acknowledge its red dot");
    f.runs([{ ...run, id: "foreground" }]);
    assert(state() === "running", "viewing a running conversation must retain its progress ring");
    f.runs([finish("foreground", "succeeded", 50)]);
    assert(!state(), "completion in the current conversation must not create an unread dot");
    f.select("", "", "settings");
    f.runs([finish("settings-background", "failed", 60)]);
    assert(state() === "failed", "a hidden conversation finishing in settings is unread");
    f.runs([], "error"); assert(state() === "failed", "a failed refresh must retain unread results");
    f.runs([], "idle"); assert(!state(), "switching devices must clear the previous device's unread results");
    f.runs([finish("first-snapshot", "succeeded", 70)]);
    assert(!state(), "a new device's historical runs must not invent unread results");
  }, true);
  await check("message_order_ignores_navigation_and_metadata", [
    { ...one, last_message_at: 10 }, { ...two, last_message_at: 20 }], f => {
    const order = () => [...f.container.querySelectorAll(".session-item")].map(n => n.dataset.sessionKey);
    assert(order()[0] === "default/two", "newest message must be first");
    f.update([{ ...one, last_message_at: 10, last_activated_at: 900, updated_at: 1000 }, { ...two, last_message_at: 20 }]);
    assert(order()[0] === "default/two", "viewing or changing metadata must not move a session");
    f.update([{ ...one, last_message_at: 30 }, { ...two, last_message_at: 20 }]);
    assert(order()[0] === "default/one", "new reply must move its session to the top");
  });
  await check("trash_focused_session", [one, two], f => {
    f.item("one").focus();
    f.update([{ ...one, status: "trash" }, two]);
    assert(!f.item("one") && f.item("two") && f.focusValid(), "trash must update the sidebar and restore focus without retry");
    assert(!f.container.querySelector(".session-read-notice"), "a completed deletion must not become a list read error");
    // An explicit reread remains safe but is no longer needed for recovery.
    f.update([{ ...one, status: "trash" }, two]);
    assert(f.item("two"), "rereading the catalog must retain remaining sessions");
    f.filter.value = "trash"; f.filter.dispatchEvent(new Event("change"));
    f.item("one").focus(); f.update([one, two]);
    assert(!f.item("one") && f.focusValid(), "restoring the last trash item must preserve a usable sidebar");
  });
  await check("remove_last_pinned_group", [session("pin", "alpha", { pinned: true })], f => {
    f.item("pin").focus(); f.update([session("pin", "alpha", { status: "trash", pinned: true })]);
    assert(!f.container.querySelector(".sidebar-pinned") && f.focusValid(), "removing the final pin must fall back to a live control");
  });
  await check("permanent_delete_trash_item", [session("old", "default", { status: "trash" })], f => {
    f.filter.value = "trash"; f.filter.dispatchEvent(new Event("change"));
    const old = f.item("old");
    const menu = old.closest(".session-item-row").querySelector(".session-more");
    menu.click();
    assert([...document.querySelectorAll('[role="menuitem"]')].some(item => /彻底删除/.test(item.textContent)),
      "recycle-bin menu must offer permanent deletion");
    old.focus(); f.update([]);
    assert(!f.item("old") && f.focusValid() && !f.container.querySelector(".session-read-notice"),
      "deleting the final recycle-bin session must leave a usable sidebar");
  });
  await check("remove_last_orphan_project", [session("orphan", "removed")], f => {
    f.item("orphan").focus(); f.update([session("orphan", "removed", { status: "archived" })]);
    assert(!f.container.querySelector(".session-project") && f.focusValid(), "removing the final orphan task must restore focus");
  });
  const pages = Array.from({ length: 12 }, (_, index) => session("page" + index, "alpha", { updated_at: 100 - index }));
  await check("expand_final_page", pages, f => {
    let more = f.container.querySelector(".session-show-more"); more.focus(); more.click();
    more = f.container.querySelector(".session-show-more");
    assert(more && document.activeElement === more, "intermediate expansion must retain the More button focus");
    more.click();
    assert(!f.container.querySelector(".session-show-more") && f.container.querySelectorAll(".session-item").length === 12,
      "the final expansion must reveal all tasks");
    assert(document.activeElement === f.item("page11"), "the final page must focus its last task");
  });
  document.querySelector("#result").textContent = JSON.stringify({ passed: true, checks });
} catch (error) {
  document.querySelector("#result").textContent = JSON.stringify({ passed: false, checks, error: error.message, stack: error.stack });
}
</script>
</html>
