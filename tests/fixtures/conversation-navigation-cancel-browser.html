<!doctype html>
<html lang="en" data-theme="light">
<meta charset="utf-8">
<title>mdo navigation cancellation QA</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>
  body { margin: 20px; }
  #workspace { position: relative; }
  #scroller { width: 100%; height: 400px; overflow: auto; }
  #result { display: block; white-space: pre-wrap; }
</style>
<h1>Production navigation handlers: cancellation and final denial</h1>
<button id="denial" type="button">Use final denial</button>
<output id="result" role="status">Ready</output>
<div id="workspace"><div id="scroller"><ol id="timeline"><li data-turn-id="1">Question</li></ol></div></div>
<div id="toast-region"></div>
<script type="module">
import { createConversationNavigation } from "/app/web/js/features/chat/conversation-navigation.js";
let deny = false, jumps = 0, indexes = 0;
const report = () => {
  document.querySelector("#result").textContent = JSON.stringify({ jumps, indexes,
    toasts: [...document.querySelectorAll("#toast-region .toast")].map(node => node.textContent) });
};
function fail() {
  window.setTimeout(report, 0);
  throw deny ? new Error("Expected history denial") : new DOMException("Cancelled old history", "AbortError");
}
const navigation = createConversationNavigation({ scroller: document.querySelector("#scroller"),
  container: document.querySelector("#timeline"),
  async onReveal() { jumps++; fail(); }, async onLoadIndex() { indexes++; fail(); } });
navigation.update({ projectId: "qa", sessionId: "cancellation", indexHasMore: true,
  turns: [{ first_event_id: 1, question: "Question", answer: "Answer" }] });
document.querySelector("#denial").addEventListener("click", () => { deny = true; report(); });
report();
</script>
</html>
