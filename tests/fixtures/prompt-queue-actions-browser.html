<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo queue interaction regression</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>
body { margin: 0; } main { height: 100vh; display: grid; grid-template-rows: minmax(0,1fr) auto; }
.conversation > p { height: 1800px; } #result { position: fixed; top: 0; left: 0; background: var(--bg); z-index: 20; }
.composer { min-height: 100px; } .composer textarea { width: 100%; }
</style>
<main><section class="conversation"><p>History</p></section><section class="composer-region">
<div class="prompt-queue" id="prompt-queue" hidden></div><form class="composer"><textarea id="prompt"></textarea></form>
</section></main><pre id="result"></pre>
<script type="module">
import { createPromptQueue } from "/app/web/js/features/chat/prompt-queue.js";
import { loadLocale } from "/app/web/js/i18n.js";
const realFetch = globalThis.fetch;
globalThis.fetch = url => realFetch(String(url).replace(/^\/lang\//, "/app/web/lang/"));
await loadLocale("zh-CN");
const container = document.querySelector("#prompt-queue"), prompt = document.querySelector("#prompt");
const ids = ["a", "b", "c"].map(char => char.repeat(32));
const profile = { model_id: "fixture", reasoning_effort: "none", permission_profile: "balanced" };
let state = { items: ids.map((id, index) => ({ id, text: `Message ${index}: ${"long preview ".repeat(30)}`,
  attachments: [], priority: false, state: "pending", profile })), revision: 5, managed: true, actions: [] };
let finishEdit, writes = [], holdEdit = false;
const clone = () => JSON.parse(JSON.stringify(state));
globalThis.fetch = async (url, options = {}) => {
  if (options.method === "POST" && String(url).endsWith("/actions")) {
    const action = JSON.parse(options.body); writes.push(action);
    if (action.revision !== state.revision) return Response.json({ ok: false,
      error: { code: "queue_revision_conflict", message: "conflict" } }, { status: 409 });
    if (holdEdit && action.kind === "withdraw") await new Promise(resolve => { finishEdit = resolve; });
    const index = state.items.findIndex(item => item.id === action.item);
    if (action.kind === "move") {
      const [item] = state.items.splice(index, 1);
      const before = action.before ? state.items.findIndex(row => row.id === action.before) : state.items.length;
      state.items.splice(before, 0, item);
    } else if (action.kind === "withdraw") state.items.splice(index, 1);
    else if (action.kind === "steer") { const [item] = state.items.splice(index, 1); item.priority = true; state.items.unshift(item); }
    state.actions.push(action); state.revision++;
  }
  return Response.json({ ok: true, data: clone() });
};
const queue = createPromptQueue({ container,
  navigation: { get: () => ({ projectId: "default", sessionId: "fixture" }), subscribe() {} },
  isRunActive: () => true,
  onWithdraw: async (_key, item, withdraw) => { await withdraw(0); prompt.value = item.text; },
});
const frame = () => new Promise(resolve => setTimeout(resolve, 25));
const row = id => [...container.querySelectorAll("li")].find(node => node.dataset.queueItemId === id);
const button = (id, kind) => row(id).querySelector(`[data-queue-focus="${id}:${kind}"]`);
const results = {};
try {
  await queue.select("default", "fixture");
  prompt.focus(); await frame();
  const originalTop = container.getBoundingClientRect().top;
  document.querySelector(".conversation").scrollTop = 900;
  results.fixedAboveComposer = Math.abs(container.getBoundingClientRect().top - originalTop) < 1 &&
    container.getBoundingClientRect().top < prompt.getBoundingClientRect().top;
  const text = row(ids[0]).querySelector(".prompt-queue-text");
  results.singleLinePreview = text.getBoundingClientRect().height <= parseFloat(getComputedStyle(text).lineHeight) + 1;
  results.fullMessageOnHover = text.title.startsWith(state.items[0].text);
  results.noUpDownButtons = !container.querySelector('[data-queue-focus$=":up"], [data-queue-focus$=":down"]');
  button(ids[0], "steer").focus();
  await frame();
  await new Promise(requestAnimationFrame);
  results.keyboardRevealsActions = getComputedStyle(row(ids[0]).querySelector(".prompt-queue-actions")).opacity === "1";
  const handle = button(ids[0], "drag"), start = handle.getBoundingClientRect();
  const target = row(ids[2]).getBoundingClientRect();
  handle.dispatchEvent(new PointerEvent("pointerdown", { bubbles: true, pointerId: 1, button: 0, clientY: start.top + 4 }));
  handle.dispatchEvent(new PointerEvent("pointermove", { bubbles: true, pointerId: 1, clientY: target.bottom - 1 }));
  handle.dispatchEvent(new PointerEvent("pointerup", { bubbles: true, pointerId: 1, clientY: target.bottom - 1 }));
  await frame();
  results.dragReorders = state.items.map(item => item.id).join() === [ids[1], ids[2], ids[0]].join() && writes.length === 1;
  button(ids[0], "drag").dispatchEvent(new KeyboardEvent("keydown", { bubbles: true, key: "ArrowUp" }));
  await frame();
  results.keyboardReorders = state.items.map(item => item.id).join() === [ids[1], ids[0], ids[2]].join();
  holdEdit = true;
  button(ids[1], "edit").click(); await frame();
  results.waitsForWithdrawalAck = prompt.value === "" && Boolean(row(ids[1])) && button(ids[1], "edit").disabled;
  finishEdit(); await frame();
  results.withdrawsFullText = !row(ids[1]) && prompt.value.startsWith("Message 1:") && prompt.value.length > 300;
  button(ids[2], "steer").click(); await frame();
  results.steersChosenMessage = state.items[0].id === ids[2] && state.items[0].priority && button(ids[2], "edit").disabled;
  state.items[0].state = "sending"; state.items[0].priority = false; state.items[0].start_claimed = true;
  state.revision++; await queue.select("default", "fixture");
  results.protectsStartedMessage = button(ids[2], "drag").disabled && button(ids[2], "edit").disabled && button(ids[2], "steer").disabled;
  results.passed = Object.values(results).every(value => value === true);
} catch (error) { results.error = error.stack; results.passed = false; }
document.querySelector("#result").textContent = JSON.stringify(results);
</script></html>
