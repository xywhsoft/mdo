<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo conversation dock seat probe</title>
<link rel="stylesheet" href="/app/web/css/app.css">
<style>
  body { margin: 0; background: var(--surface); color: var(--ink); }
  .workspace { grid-column: auto; grid-row: auto; height: 600px; margin-top: 52px; }
  .conversation-history { height: 700px; }
</style>
<main class="workspace">
  <section class="conversation" aria-label="对话">
    <div class="conversation-history">Earlier conversation</div>
  </section>
  <section class="composer-region" aria-label="发送消息">
    <div id="conversation-docks" class="conversation-docks" hidden></div>
    <div class="composer"><textarea id="prompt" aria-label="输入"></textarea>
      <div class="composer-toolbar"><button type="button">发送</button></div>
    </div>
  </section>
</main>
<div id="toast-region"></div>
<pre id="result"></pre>
<script type="module">
import { createConversationDocks } from "/app/web/js/features/chat/conversation-docks.js";
import { createResourceStore } from "/app/web/js/state/store.js";

const store = (data) => createResourceStore(data);
const navigation = {
  get: () => ({ view: "workspace", projectId: "qa", sessionId: "seat" }),
  subscribe(listener) { listener(this.get()); return () => {}; },
};
const todoStore = store({ projectId: "qa", sessionId: "seat",
  items: [{ text: "Inspect UI", done: false }] });
const asksStore = store({ projectId: "qa", sessionId: "seat", loaded: true,
  items: [{ id: 4, question: "Which route should I take?",
    options: ["Fast", "Careful"] }] });
const approvalsStore = store({ items: [] });
const runsStore = store({ items: [] });
const tasksStore = store({ items: [] });
const arrivals = [];
createConversationDocks({
  container: document.querySelector("#conversation-docks"), navigation,
  tasksStore, approvalsStore, asksStore,
  runsStore, todoStore, onOpenTasks() {}, onChanged: async () => {},
  onDecisionArrived(card, kind) {
    arrivals.push([kind, card.querySelector("h3")?.textContent]);
  },
});

const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));
async function check() {
  document.documentElement.dataset.fontSize = "large";
  const prompt = document.querySelector("#prompt");
  prompt.value = Array.from({ length: 20 }, (_, index) => `draft line ${index + 1}`).join("\n");
  prompt.style.height = "130px"; // Match the composer's auto-growed inline height.
  await nextFrame();
  await nextFrame();
  const dock = document.querySelector("#conversation-docks");
  const initialScroll = dock.scrollTop;
  const initialAvailable = dock.style.getPropertyValue("--dock-available-height");
  const initialConversationHeight = document.querySelector(".conversation").clientHeight;
  document.querySelector(".workspace").style.height = "calc(100dvh - 52px)";
  await nextFrame();
  await nextFrame();
  await nextFrame();
  await nextFrame();
  const conversation = document.querySelector(".conversation");
  const composer = document.querySelector(".composer-region");
  conversation.scrollTop = 0;
  const question = dock.querySelector(".ask-dock-question").getBoundingClientRect();
  const option = dock.querySelector(".ask-dock-options button").getBoundingClientRect();
  const area = dock.getBoundingClientRect();
  const askReadable = area.top >= conversation.getBoundingClientRect().top &&
    area.bottom <= composer.getBoundingClientRect().top &&
    question.top >= area.top && question.bottom <= area.bottom &&
    option.top >= area.top && option.bottom <= area.bottom &&
    conversation.scrollTop === 0 && prompt.getBoundingClientRect().height <= 53 &&
    prompt.value.endsWith("draft line 20");
  const askGeometry = { dockTop: area.top, dockBottom: area.bottom,
    questionTop: question.top, questionBottom: question.bottom,
    optionTop: option.top, optionBottom: option.bottom,
    promptHeight: prompt.getBoundingClientRect().height,
    initialScroll, initialAvailable, initialConversationHeight,
    resizedAvailable: dock.style.getPropertyValue("--dock-available-height"),
    resizedScroll: dock.scrollTop };

  asksStore.setData({ projectId: "qa", sessionId: "seat", loaded: true, items: [] });
  await nextFrame();
  const restoredPending = composer.hasAttribute("data-decision-pending");
  const restoredHeight = prompt.getBoundingClientRect().height;
  const restoredStyle = { inlineHeight: prompt.style.height,
    maxHeight: getComputedStyle(prompt).maxHeight };
  const restoredDraft = restoredHeight >= 120 &&
    prompt.value.endsWith("draft line 20");
  dock.querySelector(".todo-toggle").focus();
  runsStore.setData({ items: [{ agent_run_id: 3, project_id: "qa", session_id: "seat" }] });
  approvalsStore.setData({ items: [{ id: 7, run_id: 3, tool: "exec",
    risk: "high", effects: ["process"], resources: [],
    arguments_json: '{"argv":["python","-c","print(1)"]}' }] });
  todoStore.setData(todoStore.get().data);
  const approvalFocusRestored = document.activeElement?.dataset.dockFocus ===
    "approval/7/title";
  await nextFrame();
  const approvalBeforeTodo = dock.querySelector(".conversation-dock")
    ?.dataset.approvalId === "7";
  const title = dock.querySelector(".conversation-dock h3").getBoundingClientRect();
  const approvalReadable = title.top >= dock.getBoundingClientRect().top &&
    title.bottom <= dock.getBoundingClientRect().bottom;
  const scrollDockToEnd = () => {
    for (let index = 0; index < 3; index++)
      dock.dispatchEvent(new WheelEvent("wheel", {
        bubbles: true, cancelable: true, deltaY: 500,
      }));
  };
  scrollDockToEnd();
  await nextFrame();
  const allow = [...dock.querySelectorAll(".conversation-dock-actions button")].at(-1);
  const actionVisible = allow.getBoundingClientRect().bottom <=
    dock.getBoundingClientRect().bottom &&
    allow.getBoundingClientRect().top >= dock.getBoundingClientRect().top;
  dock.querySelector(".approval-arguments summary").click();
  await nextFrame();
  const approvalNode = dock.querySelector('[data-approval-id="7"]');
  const argumentsPre = approvalNode.querySelector(".approval-arguments pre");
  const selection = window.getSelection();
  const range = document.createRange();
  range.selectNodeContents(argumentsPre);
  selection.removeAllRanges();
  selection.addRange(range);
  approvalsStore.setData({ items: [{ ...approvalsStore.get().data.items[0],
    expires_in_ms: 240000 }] });
  await nextFrame();
  const approvalSelectionStable = approvalNode === dock.querySelector('[data-approval-id="7"]') &&
    argumentsPre === dock.querySelector('[data-approval-id="7"] .approval-arguments pre') &&
    selection.toString().includes("python");
  selection.removeAllRanges();
  approvalsStore.setData({ items: [{ ...approvalsStore.get().data.items[0],
    arguments_json: '{"argv":["changed"]}' }] });
  await nextFrame();
  const approvalChangeReplaced = approvalNode !== dock.querySelector('[data-approval-id="7"]') &&
    dock.querySelector('[data-approval-id="7"] .approval-arguments pre')
      ?.textContent.includes("changed");
  scrollDockToEnd();
  await nextFrame();
  const currentAllow = [...dock.querySelectorAll(".conversation-dock-actions button")].at(-1);
  const expandedReachable = currentAllow.getBoundingClientRect().bottom <=
    dock.getBoundingClientRect().bottom &&
    currentAllow.getBoundingClientRect().top >= dock.getBoundingClientRect().top;
  const statusRoot = dock.querySelectorAll(".conversation-dock-stack")[2];
  const todoNode = statusRoot.querySelector(".todo-dock");
  const todoText = todoNode.querySelector(".todo-dock-list li span:last-child");
  range.selectNodeContents(todoText);
  selection.removeAllRanges();
  selection.addRange(range);
  approvalsStore.setData({ items: [{ ...approvalsStore.get().data.items[0],
    expires_in_ms: 239000 }] });
  await nextFrame();
  const todoSelectionStable = statusRoot.querySelector(".todo-dock") === todoNode &&
    selection.toString() === "Inspect UI";
  todoStore.setData({ projectId: "qa", sessionId: "seat",
    items: [{ text: "Inspect UI", done: false, updated_at: "later" }] });
  await nextFrame();
  const todoMetadataStable = statusRoot.querySelector(".todo-dock") === todoNode &&
    selection.toString() === "Inspect UI";
  selection.removeAllRanges();
  todoStore.setData({ projectId: "qa", sessionId: "seat",
    items: [{ text: "Inspect UI updated", done: true }] });
  await nextFrame();
  const todoChangeUpdated = statusRoot.querySelector(".todo-dock") === todoNode &&
    statusRoot.querySelector(".todo-dock-list")?.textContent.includes("Inspect UI updated");
  const task = { id: 11, state: "running", label: "Check files", terminal: false,
    owner_session: "C:/qa/sessions/qa/seat/snapshot.json" };
  tasksStore.setData({ items: [task] });
  await nextFrame();
  const taskNode = statusRoot.querySelector(".conversation-dock:not(.todo-dock)");
  const taskText = taskNode.querySelector(".conversation-dock-list li span:last-child");
  range.selectNodeContents(taskText);
  selection.addRange(range);
  tasksStore.setData({ items: [{ ...task, updated_at: "later" }] });
  await nextFrame();
  const taskSelectionStable = statusRoot.querySelector(".conversation-dock:not(.todo-dock)") ===
    taskNode && selection.toString() === "Check files";
  todoStore.setData({ projectId: "qa", sessionId: "seat",
    items: [{ text: "Inspect UI again", done: true }] });
  await nextFrame();
  const taskSelectionAfterTodoChange =
    statusRoot.querySelector(".conversation-dock:not(.todo-dock)") === taskNode &&
    selection.toString() === "Check files";
  selection.removeAllRanges();
  tasksStore.setData({ items: [{ ...task, state: "pending" }] });
  await nextFrame();
  const taskChangeUpdated = statusRoot.querySelector(".conversation-dock:not(.todo-dock)") ===
    taskNode && statusRoot.querySelector(".conversation-dock:not(.todo-dock)")
      ?.textContent.includes("Check files");
  const currentTodo = statusRoot.querySelector(".todo-dock");
  range.selectNodeContents(currentTodo.querySelector(".todo-dock-list li span:last-child"));
  selection.addRange(range);
  tasksStore.setData({ items: [{ ...task, state: "running" }] });
  await nextFrame();
  const todoSelectionAfterTaskChange = statusRoot.querySelector(".todo-dock") === currentTodo &&
    selection.toString() === "Inspect UI again";
  selection.removeAllRanges();
  const survivingTask = statusRoot.querySelector(".conversation-dock:not(.todo-dock)");
  range.selectNodeContents(survivingTask.querySelector(".conversation-dock-list li span:last-child"));
  selection.addRange(range);
  todoStore.setData({ projectId: "qa", sessionId: "seat", items: [] });
  await nextFrame();
  const taskSelectionAfterTodoRemoved = statusRoot.firstElementChild === survivingTask &&
    selection.toString() === "Check files";
  selection.removeAllRanges();
  const passed = askReadable && restoredDraft && approvalReadable && actionVisible &&
    approvalFocusRestored && approvalBeforeTodo &&
    arrivals.map(([kind]) => kind).join(",") === "ask,approval" &&
    expandedReachable && approvalSelectionStable && approvalChangeReplaced &&
    todoSelectionStable && todoMetadataStable && todoChangeUpdated && taskSelectionStable &&
    taskSelectionAfterTodoChange && taskChangeUpdated && todoSelectionAfterTaskChange &&
    taskSelectionAfterTodoRemoved &&
    document.documentElement.scrollWidth <= innerWidth;
  const result = document.querySelector("#result");
  result.dataset.passed = innerWidth <= 420 ? String(passed) : "waiting";
  result.textContent = JSON.stringify({ askReadable, askGeometry,
    restoredDraft, restoredHeight, restoredPending, restoredStyle, approvalReadable,
    actionVisible, expandedReachable, approvalSelectionStable, approvalChangeReplaced,
    todoSelectionStable, todoMetadataStable, todoChangeUpdated, taskSelectionStable,
    taskSelectionAfterTodoChange, taskChangeUpdated, todoSelectionAfterTaskChange,
    taskSelectionAfterTodoRemoved,
    approvalFocusRestored, approvalBeforeTodo,
    arrivals, viewport: innerWidth,
    documentWidth: document.documentElement.scrollWidth, passed });
}
void check();
</script>
</html>
