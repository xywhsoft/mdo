<!doctype html><html lang="zh-CN" data-theme="dark">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Debug request timings</title><link rel="stylesheet" href="/app/web/css/app.css">
<style>body{margin:20px}.conversation{height:70vh;max-width:820px;margin:auto;overflow:auto}#result{white-space:pre-wrap}#timeline{padding:0}</style>
<div class="conversation"><p id="welcome"></p><ol id="timeline"></ol></div><button id="bottom" hidden>↓</button><pre id="result">Preparing</pre>
<script type="module">
import {createTimelineView} from '/app/web/js/features/chat/timeline.js';
import {createResourceStore} from '/app/web/js/state/store.js';
import {loadLocale} from '/app/web/js/i18n.js';
const output=document.querySelector('#result'),container=document.querySelector('#timeline'),checks={};
const paint=async()=>{await new Promise(requestAnimationFrame);await new Promise(requestAnimationFrame);};
try{
  await loadLocale(new URLSearchParams(location.search).get('locale')||'zh-CN');
  const store=createResourceStore(),runtimeStore=createResourceStore();
  const event=(kind,id,extra={})=>({event_id:id,kind,run_id:1,agent_turn:1,agent_depth:0,time:id*1000000,...extra});
  const events=[event('agent_start',1,{user_message_sequence:1,text:'Hello'}),event('model_start',2),
    event('model_reasoning_delta',3,{text:'Thinking'}),event('model_text_delta',4,{text:'Answer'}),
    event('model_done',5,{success:true,input_tokens:10,output_tokens:20,model_request_id:'qa-request',model_timing:{first_byte_ms:400}}),
    event('agent_done',6,{success:true,text:'Answer'})];
  const view=createTimelineView({container,welcome:document.querySelector('#welcome'),toBottom:document.querySelector('#bottom'),store,runtimeStore});
  const publish=async()=>{store.setData({projectId:'qa',sessionId:'timing',events});await paint();};
  const timing=()=>container.querySelector('.timeline-model-timing');
  await publish();checks.pendingHidden=!timing();
  runtimeStore.setData({debug:false});await paint();checks.normalHidden=!timing();
  const normalStats=container.querySelector('.timeline-stats')?.textContent;
  runtimeStore.setData({debug:true});await paint();checks.debugVisible=!!timing()&&timing().textContent.includes('qa-request');
  timing().open=true;await paint();checks.replyPreserved=container.textContent.includes('Answer');
  checks.statsUnchanged=!!normalStats&&container.querySelector('.timeline-stats')?.textContent===normalStats;
  await publish();checks.debugRefresh=!!timing();
  runtimeStore.setData({debug:false});await paint();checks.normalRemovesExisting=!timing();
  runtimeStore.setData({debug:'true'});await paint();checks.onlyBooleanFlag=!timing();
  runtimeStore.setData({debug:true});await paint();store.setData({projectId:'qa',sessionId:'other',events});await paint();
  checks.debugHistoryVisible=!!timing();
  runtimeStore.reset();await paint();checks.resetHides=!timing();
  view.destroy();checks.noOverflow=document.documentElement.scrollWidth<=innerWidth;
  output.textContent=JSON.stringify({passed:Object.values(checks).every(Boolean),checks},null,2);
}catch(error){output.textContent=JSON.stringify({passed:false,checks,error:String(error.stack)},null,2);}
</script></html>
