<!doctype html>
<html lang="zh-CN" data-theme="dark">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo export platform probe</title>
<link rel="stylesheet" href="/css/app.css">
<style>
body { display:block; padding:24px; overflow:auto; }
main { max-width:640px; margin:auto; }
h1 { font-size:20px; }
p { line-height:1.6; }
button { margin:4px 4px 4px 0; }
pre { white-space:pre-wrap; overflow-wrap:anywhere; font-size:12px; }
</style>
<main>
  <h1>导出功能检查</h1>
  <p>使用正式导出组件与样式，模拟 Android 保存桥接；不代表真机文件已经保存。</p>
  <p id="original">原会话内容：输入、回复和未发送草稿仍保留。</p>
  <button class="secondary-button" id="small" type="button">核对小文件桥接</button>
  <button class="secondary-button" id="large" type="button">打开超限备份</button>
  <label>界面语言 <select id="locale"><option value="zh-CN">中文</option><option value="en-US">English</option><option value="ru-RU">Русский</option></select></label>
  <pre id="result" role="status">正在载入正式组件…</pre>
</main>
<dialog class="app-dialog backup-export-dialog" id="backup" aria-labelledby="title" aria-describedby="scope">
  <div class="dialog-card">
    <header><h2 id="title" data-backup-title>导出会话备份</h2>
      <button class="icon-button" type="button" data-backup-close aria-label="关闭">×</button></header>
    <div class="backup-export-body">
      <p class="dialog-error" data-backup-error role="alert" tabindex="-1" hidden></p>
      <p id="scope" data-backup-scope></p>
      <p data-backup-status role="status" aria-live="polite"></p>
      <progress aria-label="备份接收进度"></progress>
    </div>
    <footer><button class="secondary-button" type="button" data-backup-cancel>取消</button>
      <button class="primary-button" type="button" data-backup-retry hidden>重新导出</button></footer>
  </div>
</dialog>
<script type="module">
import { saveBlobFile, ANDROID_EXPORT_MAX_BYTES } from "/js/utils/file-download.js";
import { createSessionBackupExport } from "/js/features/sessions/session-backup-export.js";
import { loadLocale } from "/js/i18n.js";
const output = document.querySelector("#result");
const record = { bridgeClicks: [], successNotices: [], exportRequests: [] };
// Like the shell, the simulated bridge observes download anchors at document
// level. It only reads this fixture's tiny Blob; it never writes a real file.
globalThis.XsExport = { save() {} };
document.addEventListener("click", async (event) => {
  const anchor = event.target.closest?.("a[download]");
  if (!anchor || !anchor.href.startsWith("blob:")) return;
  event.preventDefault();
  const capture = { filename:anchor.download, connected:anchor.isConnected };
  const blob = await (await fetch(anchor.href)).blob();
  capture.bytes = blob.size; capture.text = await blob.text();
  record.bridgeClicks.push(capture); render();
}, true);
function render() { output.textContent = JSON.stringify(record, null, 2); }
const view = createSessionBackupExport({ dialog:document.querySelector("#backup"),
  download:async (session) => {
    record.exportRequests.push(session.id); render();
    // The real serializer/HTTP transfer has separate integration coverage.
    // Size alone reaches the production guard without allocating a large Blob.
    return { filename:"large.json", blob:{ size:ANDROID_EXPORT_MAX_BYTES + 1 } };
  }, notify:message => { record.successNotices.push(message); render(); }
});
document.querySelector("#small").addEventListener("click", () => {
  saveBlobFile({ filename:"技能包.mdo-extension.json", blob:new Blob(["mdo export QA"], { type:"application/json" }) });
});
document.querySelector("#large").addEventListener("click", () => {
  view.open({ project_id:"fixture", id:"original-session", title:"原会话" });
});
document.querySelector("#locale").addEventListener("change", event => { void loadLocale(event.target.value); });
await loadLocale("zh-CN"); render();
</script>
</html>
