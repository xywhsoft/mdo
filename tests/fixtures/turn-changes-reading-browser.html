<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="/app/web/css/app.css"><div id="cards"></div><output id="result">Preparing</output>
<script type="module">
import {createTurnChanges} from '/app/web/js/features/chat/turn-changes.js';
import {loadLocale} from '/app/web/js/i18n.js';
const checks={},errors=[];addEventListener('error',e=>errors.push(e.message));
try{
 await loadLocale(new URL(location.href).searchParams.get('locale')||'zh-CN');
 const calls=new Map(),wait=ms=>new Promise(r=>setTimeout(r,ms));
 const context={projectId:'qa',sessionId:'a'},now=Date.now()*1000;
 const view=createTurnChanges({read:async(_context,turn)=>{
   const count=(calls.get(turn)||0)+1;calls.set(turn,count);
   if(turn===1&&count===1)throw Object.assign(Error('temporary network'),{status:503});
   if(turn===2&&count===1||turn===5)throw Object.assign(Error('publishing receipt'),{code:'git_turn_missing'});
   if(turn===3)throw Object.assign(Error('not a Git workspace'),{code:'git_not_repository'});
   if(turn===6)throw Object.assign(Error('Git not installed'),{code:'git_unavailable'});
   if(turn===4)throw Object.assign(Error('specific access failure'),{status:403});
   if(turn===7)throw Object.assign(Error('snapshot exceeds limit'),{code:'git_turn_unavailable'});
   if(turn===8)return {files:[],additions:0,deletions:0};
   if(turn===9)throw Object.assign(Error('offline'),{status:503});
   return {files:[{path:'main.c',stats_available:true,additions:1,deletions:0}],additions:1,deletions:0};
 }});
 const node=turn=>view.node({kind:'changes',turn,time:now},{...context});
 const roots=[1,2,3,4,5,6,7,8,9].map(node);document.querySelector('#cards').append(...roots);
 await wait(50);checks.temporaryFailureQuiet=roots[0].hidden&&calls.get(1)===1;
 checks.pendingCaptureQuiet=roots[1].hidden&&calls.get(2)===1;
 checks.nonGitQuiet=roots[2].hidden&&calls.get(3)===1;
 checks.gitNotInstalledQuiet=roots[5].hidden&&calls.get(6)===1;
 checks.permanentFailureQuiet=roots[3].hidden&&roots[3].children.length===0&&calls.get(4)===1;
 checks.unavailableCaptureQuiet=roots[6].hidden&&roots[6].children.length===0&&calls.get(7)===1;
 checks.emptyDiffQuiet=roots[7].hidden&&roots[7].children.length===0;
 view.retain([1,2,3,4,6,7,8,9].map(turn=>({kind:'changes',turn})),context);
 await wait(1900);
 checks.transientReadRecovered=calls.get(1)===2&&Boolean(roots[0].querySelector('.turn-changes-file'));
 checks.capturePublicationRecovered=calls.get(2)===2&&Boolean(roots[1].querySelector('.turn-changes-file'));
 checks.disposedReadNotRetried=calls.get(5)===1;
 checks.exhaustedReadQuiet=calls.get(9)===4&&roots[8].hidden&&roots[8].children.length===0;
 checks.failedSummaryNotReopened=view.node({kind:'changes',turn:4,time:now},context)===roots[3]&&roots[3].hidden&&calls.get(4)===1;
 view.destroy();checks.noOverflow=document.documentElement.scrollWidth<=innerWidth;
 document.querySelector('#result').textContent=JSON.stringify({passed:errors.length===0&&Object.values(checks).every(Boolean),checks,errors});
}catch(error){document.querySelector('#result').textContent=JSON.stringify({passed:false,checks,error:String(error.stack),errors});}
</script></html>
