<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo queue scroll probe</title>
<link rel="stylesheet" href="/app/web/css/app.css?queue-scroll=1">
<style>
  body { padding: 20px; }
  #queue { width: 280px; }
  #queue .prompt-queue-list { height: 90px; overflow-y: auto; }
  #queue .prompt-queue-list li { min-height: 65px; }
</style>
<textarea id="prompt"></textarea>
<div id="queue"></div>
<pre id="result"></pre>
<script type="module">
const { createPromptQueue } = await import(
  `/app/web/js/features/chat/prompt-queue.js?fixture=${Date.now()}`);

const container = document.querySelector("#queue");
const output = document.querySelector("#result");
const originalFetch = window.fetch;
let route = { projectId: "qa", sessionId: "first" };
let staged = [];
let omitFirst = false;
let omitSecond = false;
const listeners = [];
window.fetch = async (url) => {
  const second = String(url).includes("/sessions/second/");
  const items = (second ? ["Other session"] : [
    `First item ${"long text ".repeat(28)}`,
    `Second item ${"more text ".repeat(28)}`,
    `Third item ${"final text ".repeat(28)}`,
  ])
    .map((text, index) => ({ id: `item-${index}`, text, state: "pending",
      attachments: [], priority: false }))
    .filter((item) => second ||
      ((!omitFirst || item.id !== "item-0") &&
        (!omitSecond || item.id !== "item-1")));
  return new Response(JSON.stringify({ ok: true, data: { items } }), {
    status: 200, headers: { "Content-Type": "application/json" },
  });
};
try {
  const queue = createPromptQueue({ container,
    navigation: { get: () => route, subscribe: (listener) => listeners.push(listener) },
    stagedEntries: () => staged, isRunActive: () => true,
  });
  await queue.select("qa", "first");
  let list = container.querySelector(".prompt-queue-list");
  const cardsFit = [...list.children].every((item) =>
    item.querySelector(".prompt-queue-text").getBoundingClientRect().bottom <=
    item.getBoundingClientRect().bottom + 1);
  const selectedCard = list.children[1];
  const selectedText = selectedCard.querySelector(".prompt-queue-text").firstChild;
  const range = document.createRange();
  range.setStart(selectedText, 0);
  range.setEnd(selectedText, 11);
  const selection = window.getSelection();
  selection.removeAllRanges();
  selection.addRange(range);
  const selectedValue = selection.toString();
  queue.render();
  list = container.querySelector(".prompt-queue-list");
  const selectionAfterRender = selection.toString() === selectedValue &&
    list.children[1] === selectedCard;
  await queue.select("qa", "first");
  list = container.querySelector(".prompt-queue-list");
  const selectionAfterPoll = selection.toString() === selectedValue &&
    list.children[1] === selectedCard;
  list.scrollTop = 20;
  const middleBefore = list.scrollTop;
  staged.push({ id: "draft-2", staged: true, text: "Third item" });
  queue.render();
  list = container.querySelector(".prompt-queue-list");
  const middleAfter = list.scrollTop;
  const selectionAfterSiblingAdded = selection.toString() === selectedValue &&
    list.children[1] === selectedCard;
  list.scrollTop = list.scrollHeight;
  const bottomBefore = list.scrollTop;
  staged.push({ id: "draft-3", staged: true, text: "Fourth item" });
  queue.render();
  list = container.querySelector(".prompt-queue-list");
  const bottomAfter = list.scrollTop;
  const newBottom = list.scrollHeight - list.clientHeight;
  staged = [];
  queue.render();
  list = container.querySelector(".prompt-queue-list");
  const secondCard = list.children[1];
  list.scrollTop += secondCard.getBoundingClientRect().top -
    list.getBoundingClientRect().top;
  const beforeHeadRemoval = secondCard.getBoundingClientRect().top -
    list.getBoundingClientRect().top;
  omitFirst = true;
  await queue.select("qa", "first");
  list = container.querySelector(".prompt-queue-list");
  const afterHeadRemoval = list.children[0].getBoundingClientRect().top -
    list.getBoundingClientRect().top;
  const headRemovalStable = Math.abs(afterHeadRemoval - beforeHeadRemoval) <= 1;
  const selectionAfterHeadRemoval = list.children[0] === selectedCard &&
    selection.toString() === selectedValue &&
    selectedCard.querySelector(".prompt-queue-index").textContent === "1" &&
    selectedCard.querySelector("button[data-queue-index]")?.dataset.queueIndex === "0";
  list.scrollTop = 80;
  const currentBeforeRemoval = list.children[0].getBoundingClientRect().top -
    list.getBoundingClientRect().top;
  omitSecond = true;
  await queue.select("qa", "first");
  list = container.querySelector(".prompt-queue-list");
  const nextAfterRemoval = list.children[0].getBoundingClientRect().top -
    list.getBoundingClientRect().top;
  const nextStartsAtTop = Math.abs(nextAfterRemoval) <= 1;
  route = { projectId: "qa", sessionId: "second" };
  listeners.forEach((listener) => listener(route));
  await queue.select("qa", "second");
  list = container.querySelector(".prompt-queue-list");
  const otherSessionTop = list.scrollTop;
  const passed = cardsFit && selectionAfterRender && selectionAfterPoll &&
    selectionAfterSiblingAdded && selectionAfterHeadRemoval &&
    headRemovalStable && nextStartsAtTop &&
    middleBefore === 20 && middleAfter === middleBefore &&
    bottomBefore > middleBefore && bottomAfter === newBottom &&
    newBottom > bottomBefore && otherSessionTop === 0;
  output.dataset.passed = String(passed);
  output.textContent = JSON.stringify({ passed, cardsFit, selectionAfterRender,
    selectionAfterPoll, selectionAfterSiblingAdded, selectionAfterHeadRemoval,
    middleBefore, middleAfter,
    bottomBefore, bottomAfter, newBottom, beforeHeadRemoval,
    afterHeadRemoval, headRemovalStable, currentBeforeRemoval,
    nextAfterRemoval, nextStartsAtTop, otherSessionTop }, null, 2);
} catch (error) {
  output.dataset.passed = "false";
  output.textContent = error.stack ?? String(error);
} finally { window.fetch = originalFetch; }
</script>
</html>
