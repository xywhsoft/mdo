<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo shortcuts dialog keyboard probe</title>
<link rel="stylesheet" href="/app/web/css/app.css?shortcuts-keyboard=2">
<div class="app-shell" id="shell"><main class="workspace"></main></div>
<dialog class="app-dialog shortcuts-dialog" id="shortcuts-dialog" aria-labelledby="shortcuts-title">
  <form method="dialog" class="dialog-card">
    <header><div><h2 id="shortcuts-title">快捷键与命令</h2>
      <p>输入框外按 ? 打开，Esc 关闭；macOS 用 ⌘ 代替 Ctrl。</p></div>
      <button class="icon-button" value="close" aria-label="关闭快捷键帮助">×</button></header>
    <div class="shortcuts-content">
      <h3>键盘操作</h3><dl>
        <div><dt><kbd>Enter</kbd></dt><dd>发送；运行中加入待发送队列</dd></div>
        <div><dt><kbd>Shift</kbd> + <kbd>Enter</kbd></dt><dd>输入换行</dd></div>
        <div><dt><kbd>Ctrl</kbd> + <kbd>Enter</kbd></dt><dd>中断当前运行</dd></div>
        <div><dt><kbd>Esc</kbd></dt><dd>关闭弹层</dd></div>
        <div><dt><kbd>Ctrl</kbd> + <kbd>K</kbd></dt><dd>新建任务</dd></div>
        <div><dt><kbd>Ctrl</kbd> + <kbd>F</kbd></dt><dd>搜索当前会话</dd></div>
        <div><dt><kbd>Ctrl</kbd> + <kbd>E</kbd></dt><dd>导出当前会话</dd></div>
        <div><dt><kbd>Ctrl</kbd> + <kbd>J</kbd></dt><dd>切换主题</dd></div>
      </dl><h3>输入增强</h3><p>输入 / 查看命令，输入 @ 补全文件。</p>
    </div>
    <footer><button class="primary-button" value="close">知道了</button></footer>
  </form>
</dialog>
<pre id="result"></pre>
<script type="module">
import { trackMobileViewport } from "/app/web/js/features/shell/mobile-viewport.js";
const shell = document.querySelector("#shell");
const dialog = document.querySelector("#shortcuts-dialog");
const content = dialog.querySelector(".shortcuts-content");
const footer = dialog.querySelector("footer");
const viewport = Object.assign(new EventTarget(),
  { height: innerHeight, offsetTop: 0, scale: 1 });
const win = Object.assign(new EventTarget(),
  { innerHeight, visualViewport: viewport });
trackMobileViewport(shell, Object.assign(new EventTarget(), { matches: true }), win);
dialog.showModal();
const frame = () => new Promise((resolve) => requestAnimationFrame(() =>
  requestAnimationFrame(resolve)));
const geometry = () => {
  const r = dialog.getBoundingClientRect();
  return { top: r.top, bottom: r.bottom,
    footerBottom: footer.getBoundingClientRect().bottom,
    contentHeight: content.clientHeight, contentScrollHeight: content.scrollHeight };
};
await frame();
viewport.height = 250;
viewport.dispatchEvent(new Event("resize"));
await frame();
const visible = geometry();
viewport.offsetTop = 20;
viewport.dispatchEvent(new Event("scroll"));
await frame();
const panned = geometry();
viewport.offsetTop = innerHeight - viewport.height;
viewport.dispatchEvent(new Event("scroll"));
await frame();
const bottomPanned = geometry();
viewport.height = innerHeight;
viewport.offsetTop = 0;
viewport.dispatchEvent(new Event("resize"));
await frame();
const restored = geometry();
const result = { visible, panned, bottomPanned, restored,
  passed: visible.top >= 0 && visible.bottom <= 250 &&
    visible.footerBottom <= 250 &&
    visible.contentScrollHeight > visible.contentHeight &&
    panned.top >= 28 && panned.bottom <= 270 &&
    bottomPanned.top >= innerHeight - 250 + 8 && bottomPanned.bottom <= innerHeight &&
    restored.bottom > visible.bottom };
document.querySelector("#result").dataset.passed = String(result.passed);
document.querySelector("#result").textContent = JSON.stringify(result, null, 2);
</script>
</html>
