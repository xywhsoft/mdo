<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<title>mdo decision panel stability probe</title>
<div role="tabpanel">
  <div id="summary"></div>
  <div id="cards"></div>
</div>
<pre id="result"></pre>
<script type="module">
import { createDecisionPanel } from "/app/web/js/features/approvals/decision-panel.js";
import { createResourceStore } from "/app/web/js/state/store.js";

const item = { id: 7, tool: "exec", risk: "high", effects: ["process"],
  resources: [{ kind: "command", resource: "python -c print(1)" }],
  arguments_json: '{"argv":["python","-c","print(1)"]}',
  expires_in_ms: 250000 };
const store = createResourceStore({ total: 1, items: [item] });
createDecisionPanel({ container: document.querySelector("#cards"),
  summary: document.querySelector("#summary"), store, onChanged: async () => {} });
const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve));
await nextFrame();
const card = document.querySelector(".approval-card");
card.querySelector("details").open = true;
await nextFrame();
const pre = card.querySelector(".approval-arguments pre");
const selection = window.getSelection();
const range = document.createRange();
range.selectNodeContents(pre);
selection.removeAllRanges();
selection.addRange(range);
store.setData({ total: 1, items: [{ ...item, expires_in_ms: 240000 }] });
await nextFrame();
const sameCard = card === document.querySelector(".approval-card");
const samePre = pre === document.querySelector(".approval-arguments pre");
const selectionKept = selection.toString().includes("python");
const timerUpdated = card.querySelector(".approval-timeout").textContent.includes("240");
const stable = sameCard && samePre && selectionKept && timerUpdated;
store.setData({ total: 2, items: [{ ...item, expires_in_ms: 240000 },
  { ...item, id: 8, tool: "read", expires_in_ms: 180000 }] });
await nextFrame();
const arrivalKeptCard = card === document.querySelector(".approval-card");
const arrivalKeptSelection = selection.toString().includes("python");
const arrivalSamePre = pre === card.querySelector(".approval-arguments pre");
const arrivalKeptExpansion = card.querySelector("details").open;
const arrivalAdded = document.querySelectorAll(".approval-card").length === 2;
const arrivalStable = arrivalKeptCard && arrivalSamePre && arrivalKeptSelection &&
  arrivalKeptExpansion && arrivalAdded;
selection.removeAllRanges();
const second = document.querySelectorAll(".approval-card")[1];
second.querySelector("details").open = true;
await nextFrame();
const secondPre = second.querySelector(".approval-arguments pre");
const secondRange = document.createRange();
secondRange.selectNodeContents(secondPre);
selection.addRange(secondRange);
store.setData({ total: 2, items: [
  { ...item, arguments_json: '{"argv":["changed"]}' },
  { ...item, id: 8, tool: "read", expires_in_ms: 180000 },
] });
await nextFrame();
const changed = card !== document.querySelector(".approval-card") &&
  document.querySelector(".approval-arguments pre")?.textContent.includes("changed");
const unaffectedCard = second === document.querySelectorAll(".approval-card")[1];
const unaffectedSelection = selection.toString().includes("python");
const changedStable = changed && unaffectedCard && unaffectedSelection;
const result = document.querySelector("#result");
result.dataset.passed = String(stable && arrivalStable && changedStable);
result.textContent = JSON.stringify({ sameCard, samePre, selectionKept,
  timerUpdated, stable, arrivalKeptCard, arrivalKeptSelection,
  arrivalSamePre, arrivalKeptExpansion, arrivalAdded, arrivalStable,
  changed, unaffectedCard, unaffectedSelection, changedStable,
  passed: stable && arrivalStable && changedStable });
</script>
</html>
