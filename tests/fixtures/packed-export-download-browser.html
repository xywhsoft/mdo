<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>mdo packed export download probe</title>
<style>
body { margin:0; display:grid; grid-template-rows:110px minmax(0,1fr); height:100dvh; font:14px sans-serif; }
header { padding:6px; overflow:auto; }
pre { margin:4px 0; white-space:pre-wrap; overflow-wrap:anywhere; }
iframe { width:100%; height:100%; min-width:0; min-height:0; border:0; }
</style>
<header><strong>正式导出 Blob 核对（不拦截原下载）</strong>
<pre id="result" role="status">等待工作台</pre></header>
<iframe id="mdo" title="打包版工作台"></iframe>
<script type="module">
const frame = document.querySelector("#mdo");
const output = document.querySelector("#result");
const captures = [];
frame.addEventListener("load", () => {
  const urls = frame.contentWindow.URL;
  const original = urls.createObjectURL.bind(urls);
  // Observe only export data; preserve the native URL and actual download.
  // The replacement belongs to this owned QA iframe and disappears on close.
  urls.createObjectURL = (blob) => {
    const url = original(blob);
    const markdown = blob.type.startsWith("text/markdown");
    // The backup API deliberately downloads JSON as application/octet-stream.
    const jsonCandidate = blob.type.includes("json") || blob.type === "application/octet-stream";
    if (markdown || jsonCandidate) {
      void blob.text().then(async (text) => {
        let document = null;
        if (!markdown) {
          try { document = JSON.parse(text); } catch { return; }
          if (!document || typeof document !== "object" ||
              !("export_schema" in document && ("snapshot" in document || document.export_schema === 2))) return;
        }
        const capture = { type:blob.type, bytes:blob.size, capturedAt:Date.now(),
          hasSyntheticPrompt:text.includes("EXPORT DOWNLOAD QA"),
          hasSyntheticPng:text.includes("iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB"),
          markdownImageReferences:(text.match(/^- [a-f0-9]{32}$/gm) || []).length,
          markdownEmbeddedImages:(text.match(/!\[[^\n]*\]\(data:image\//g) || []).length +
            (text.match(/^\[mdo-image-[a-f0-9]{32}\]: data:image\//gm) || []).length };
        if (markdown) {
          const embedded = [...text.matchAll(/data:image\/(?:png|jpeg|webp);base64,([A-Za-z0-9+/]+={0,2})/g)];
          capture.embeddedImageBytes = embedded.map((match) => atob(match[1]).length);
          const previous = captures.findLast(entry => entry.schema === 2);
          if (crypto.subtle) {
            capture.embeddedImageSha256 = await Promise.all(embedded.map(async match => {
              const bytes = Uint8Array.from(atob(match[1]), character => character.charCodeAt(0));
              const hash = new Uint8Array(await crypto.subtle.digest("SHA-256", bytes));
              return Array.from(hash, value => value.toString(16).padStart(2, "0")).join("");
            }));
            if (previous) {
              const expected = previous.imageFiles.map(file => file.sha256).sort();
              capture.imagesMatchPreviousBackup = embedded.length > 0 &&
                JSON.stringify(capture.embeddedImageSha256.slice().sort()) === JSON.stringify(expected);
            }
          }
          capture.hasOriginalImageName = text.includes('截图 "1" 100%\\.png');
          capture.hasLongOriginalImageName = text.includes("跨平台附件".repeat(40) + "\\.png");
          capture.imagesIncomplete = text.includes("部分图片未包含");
        }
        if (document) {
          capture.keys = Object.keys(document);
          capture.snapshotType = typeof document.snapshot;
          if (document.export_schema === 2) {
            capture.schema = document.export_schema;
            capture.files = document.files.map((file) => ({ path: file.path, bytes: file.bytes, sha256: file.sha256 }));
            const decodeText = file => new TextDecoder("utf-8", { fatal: true }).decode(
              Uint8Array.from(atob(file.data), character => character.charCodeAt(0)));
            const ui = document.files.find(file => file.path === "ui-events.jsonl");
            // v2 stores text files as base64; searching the outer JSON cannot
            // prove that the original input/reply was included. Read only the
            // small owned fixture's UI and attachment metadata, never artifacts.
            if (ui && ui.bytes <= 262144) {
              const uiText = decodeText(ui);
              capture.uiReadbackBytes = atob(ui.data).length;
              capture.hasSyntheticPrompt = uiText.includes("EXPORT ");
              capture.hasSyntheticReply = uiText.includes("UI fixture completed.");
            }
            capture.imageFiles = document.files.filter((file) => /^attachments\/[a-f0-9]{32}\.bin$/.test(file.path))
              .map((file) => {
                const meta = document.files.find(entry => entry.path === file.path.replace(/\.bin$/, ".json"));
                return { path: file.path, decodedBytes: atob(file.data).length, sha256: file.sha256,
                  fileName: meta && meta.bytes <= 4096 ? JSON.parse(decodeText(meta)).file_name : null };
              });
            capture.restoreReady = document.restore_ready;
          }
        }
        captures.push(capture);
        output.textContent = JSON.stringify(captures.slice(-4), null, 2);
      }).catch((error) => { output.textContent = error.message; });
    }
    return url;
  };
  output.textContent = "观察已就绪，请使用正式工作台的导出入口";
});
frame.src = "__MDO_QA_ROUTE__";
</script>
</html>
